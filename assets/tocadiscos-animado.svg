<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Propuesta de tocadiscos animado para Lucuma Records</title>
  <desc id="desc">Disco negro con surcos y etiqueta celeste que gira lentamente. El brazo plateado, las luces, el medidor y la perilla permanecen quietos sobre un fondo mostaza.</desc>
  <defs>
    <radialGradient id="mustard" cx="48%" cy="40%" r="78%">
      <stop stop-color="#ffd044"/>
      <stop offset=".58" stop-color="#f7bd2e"/>
      <stop offset="1" stop-color="#e9a913"/>
    </radialGradient>
    <radialGradient id="platter" cx="34%" cy="25%" r="82%">
      <stop stop-color="#d8d7d2"/>
      <stop offset=".45" stop-color="#8d8c87"/>
      <stop offset=".75" stop-color="#4c4b47"/>
      <stop offset="1" stop-color="#b6b3aa"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="35%" cy="28%" r="78%">
      <stop stop-color="#313130"/>
      <stop offset=".34" stop-color="#171717"/>
      <stop offset=".72" stop-color="#090909"/>
      <stop offset=".9" stop-color="#242423"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="label" cx="32%" cy="25%" r="82%">
      <stop stop-color="#b4dce3"/>
      <stop offset=".65" stop-color="#83bdc9"/>
      <stop offset="1" stop-color="#6babb8"/>
    </radialGradient>
    <linearGradient id="armMetal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f7f1"/>
      <stop offset=".22" stop-color="#777a7b"/>
      <stop offset=".43" stop-color="#eeeeea"/>
      <stop offset=".66" stop-color="#8b8d8b"/>
      <stop offset=".84" stop-color="#f3f1e9"/>
      <stop offset="1" stop-color="#626462"/>
    </linearGradient>
    <radialGradient id="chrome" cx="30%" cy="25%" r="80%">
      <stop stop-color="#fff"/>
      <stop offset=".3" stop-color="#d4d3ce"/>
      <stop offset=".65" stop-color="#85847f"/>
      <stop offset=".88" stop-color="#e9e7e0"/>
      <stop offset="1" stop-color="#686762"/>
    </radialGradient>
    <radialGradient id="greenLight" cx="30%" cy="25%" r="80%">
      <stop stop-color="#fff"/>
      <stop offset=".2" stop-color="#a9e68d"/>
      <stop offset=".62" stop-color="#63c879"/>
      <stop offset="1" stop-color="#208447"/>
    </radialGradient>
    <radialGradient id="redLight" cx="30%" cy="25%" r="80%">
      <stop stop-color="#fff"/>
      <stop offset=".2" stop-color="#f2a18d"/>
      <stop offset=".62" stop-color="#d75c51"/>
      <stop offset="1" stop-color="#9b302d"/>
    </radialGradient>
    <linearGradient id="meterFace" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffef8"/>
      <stop offset="1" stop-color="#d9d5c9"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .record-spin{transform-box:fill-box;transform-origin:center}
      @keyframes record-revolution{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:no-preference){.record-spin{animation:record-revolution 24s linear infinite}}
      @media(prefers-reduced-motion:reduce){.record-spin{animation:none!important}}
    </style>
  </defs>

  <rect width="1000" height="410" fill="url(#mustard)"/>
  <ellipse cx="382" cy="224" rx="204" ry="181" fill="#6f4700" opacity=".34" filter="url(#softShadow)"/>

  <!-- Metal platter rim -->
  <circle cx="370" cy="205" r="187" fill="url(#platter)" stroke="#4c4b47" stroke-width="2"/>
  <circle cx="370" cy="205" r="182" fill="none" stroke="#f0eee7" stroke-opacity=".58" stroke-width="2"/>
  <circle cx="370" cy="205" r="178" fill="#191919"/>

  <!-- Only this group rotates: the grooves, light streaks and label -->
  <g transform="translate(370 205)">
    <g class="record-spin">
      <circle r="176" fill="url(#vinyl)"/>
      <circle r="170" fill="none" stroke="#8d8d8a" stroke-opacity=".58" stroke-width="1.3"/>
      <circle r="162" fill="none" stroke="#050505" stroke-opacity=".92" stroke-width="2"/>
      <circle r="154" fill="none" stroke="#a5a49f" stroke-opacity=".28" stroke-width="1"/>
      <circle r="147" fill="none" stroke="#050505" stroke-opacity=".8" stroke-width="1.7"/>
      <circle r="139" fill="none" stroke="#b2b0aa" stroke-opacity=".25" stroke-width="1"/>
      <circle r="132" fill="none" stroke="#050505" stroke-opacity=".82" stroke-width="1.6"/>
      <circle r="124" fill="none" stroke="#a6a49f" stroke-opacity=".24" stroke-width="1"/>
      <circle r="117" fill="none" stroke="#050505" stroke-opacity=".78" stroke-width="1.5"/>
      <circle r="109" fill="none" stroke="#b6b4af" stroke-opacity=".22" stroke-width="1"/>
      <circle r="102" fill="none" stroke="#050505" stroke-opacity=".8" stroke-width="1.5"/>
      <circle r="94" fill="none" stroke="#aaa8a2" stroke-opacity=".2" stroke-width="1"/>
      <circle r="87" fill="none" stroke="#050505" stroke-opacity=".8" stroke-width="1.4"/>
      <circle r="79" fill="none" stroke="#b8b6b1" stroke-opacity=".18" stroke-width="1"/>
      <circle r="71" fill="none" stroke="#050505" stroke-opacity=".82" stroke-width="1.4"/>
      <path d="M-135-94A164 164 0 0 1 52-154" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
      <path d="M-163 35A167 167 0 0 0-100 132" fill="none" stroke="#c9c8c2" stroke-opacity=".19" stroke-width="2"/>
      <path d="M70 116A137 137 0 0 0 132 55" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1.5"/>
      <!-- Beveled label ring and soft cyan center -->
      <circle r="51" fill="#060606"/>
      <circle r="44" fill="url(#label)" stroke="#d4eef0" stroke-opacity=".65" stroke-width="1.5"/>
      <circle r="36" fill="none" stroke="#609aa5" stroke-opacity=".5" stroke-width="1"/>
      <circle r="29" fill="none" stroke="#c1e3e6" stroke-opacity=".5" stroke-width="1"/>
      <circle r="8" fill="url(#chrome)" stroke="#686763" stroke-width="1"/>
      <circle r="2.7" fill="#555651"/>
      <path d="M-25-25A35 35 0 0 1 20-29" fill="none" stroke="#fff" stroke-opacity=".48" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Fixed tonearm assembly, drawn over the rotating record -->
  <g class="tonearm">
    <ellipse cx="785" cy="78" rx="44" ry="43" fill="#6f4700" opacity=".28" filter="url(#softShadow)"/>
    <path d="M773 35 781 18 812 26 806 45Z" fill="url(#chrome)" stroke="#686762" stroke-width="2"/>
    <circle cx="785" cy="76" r="39" fill="url(#chrome)" stroke="#555550" stroke-width="3"/>
    <circle cx="785" cy="76" r="31" fill="#555653" stroke="#e2e0d9" stroke-width="2"/>
    <circle cx="785" cy="76" r="19" fill="url(#chrome)" stroke="#777671" stroke-width="2"/>
    <circle cx="785" cy="76" r="6" fill="#696a67"/>
    <path d="M767 100 678 236Q672 247 657 256L535 279" fill="none" stroke="#535452" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M767 96 678 232Q672 243 657 252L535 275" fill="none" stroke="url(#armMetal)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M767 96 678 232Q672 243 657 252L535 275" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="678" cy="236" r="9" fill="url(#chrome)" stroke="#555550" stroke-width="2"/>
    <g transform="rotate(-24 533 283)">
      <rect x="503" y="267" width="62" height="34" rx="7" fill="url(#armMetal)" stroke="#595a57" stroke-width="2"/>
      <rect x="510" y="272" width="48" height="23" rx="4" fill="#a5a5a0" opacity=".75"/>
      <circle cx="552" cy="282" r="12" fill="url(#chrome)" stroke="#5b5b58" stroke-width="2"/>
      <circle cx="552" cy="282" r="4" fill="#666762"/>
      <path d="M522 300 518 312" stroke="#282927" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M520 300 517 308" stroke="#f3f0e9" stroke-opacity=".8" stroke-width="1"/>
    </g>
  </g>

  <!-- Static indicator lights, analog meter and metal speed knob -->
  <g class="deck-controls">
    <circle cx="835" cy="158" r="15" fill="#7f5a13" opacity=".35"/>
    <circle cx="835" cy="155" r="12" fill="url(#greenLight)" stroke="#a88c39" stroke-width="2"/>
    <ellipse cx="831" cy="151" rx="4" ry="2.5" fill="#fff" opacity=".72"/>
    <circle cx="887" cy="158" r="15" fill="#7f5a13" opacity=".35"/>
    <circle cx="887" cy="155" r="12" fill="url(#redLight)" stroke="#a88c39" stroke-width="2"/>
    <ellipse cx="883" cy="151" rx="4" ry="2.5" fill="#fff" opacity=".72"/>

    <path d="M797 249Q850 190 903 249L891 264Q850 226 809 264Z" fill="#77736a" opacity=".45"/>
    <path d="M798 244Q850 185 902 244L891 257Q850 220 809 257Z" fill="url(#meterFace)" stroke="#6f6b62" stroke-width="3"/>
    <path d="M806 244Q850 194 894 244" fill="none" stroke="#aaa69b" stroke-width="1"/>
    <path d="m808 240 7 7m5-17 6 8m7-18 4 9m10-17 2 10m12-12v10m12-9-2 10m12-6-4 9m13 0-6 8m12 7-7 6" fill="none" stroke="#716d64" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M850 252 842 215" stroke="#a2473f" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="850" cy="252" r="4" fill="url(#chrome)" stroke="#77736a"/>

    <ellipse cx="850" cy="352" rx="38" ry="14" fill="#76520d" opacity=".26" filter="url(#softShadow)"/>
    <circle cx="850" cy="338" r="33" fill="url(#chrome)" stroke="#6a6964" stroke-width="2"/>
    <circle cx="850" cy="338" r="25" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="1.2"/>
    <path d="M850 299v7m19-2-3 7m17 8-6 4m11 15h-7m-2 18-7-3m-10 16-3-7m-17 8v-7m-17-2 3-7m-17-10 7-3m-8-16h7m2-18 7 3m10-16 3 7" fill="none" stroke="#827f78" stroke-width="2" stroke-linecap="round"/>
    <circle cx="850" cy="338" r="4" fill="#9c9b95"/>
  </g>
</svg>